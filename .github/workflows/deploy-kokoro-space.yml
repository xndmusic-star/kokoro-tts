name: Publicar Xandao Voice Studio no Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'huggingface-space/**'
      - '.github/workflows/deploy-kokoro-space.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade 'huggingface_hub>=0.34,<2'
      - name: Sincronizar arquivos para Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path="huggingface-space",
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              commit_message="Atualizar Xandao Voice Studio pelo GitHub",
          )
          PY
